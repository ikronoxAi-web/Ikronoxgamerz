<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Dodge</title>
  <style>
    body { margin: 0; background: #0A0A0A; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { background: #111; border: 2px solid #7A00FF; border-radius: 12px; max-width: 96vw; max-height: 75vh; touch-action: none; }
    .hud { margin-bottom: 10px; font-weight: 700; color: #FFD500; }
    .hint { margin-top: 8px; font-size: 0.85rem; color: #bbb; }
  </style>
</head>
<body>
  <div class="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
  <canvas id="c" width="380" height="520"></canvas>
  <div class="hint">Move with Left/Right Arrow, A/D, or Touch/Drag</div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    let best = Number(localStorage.getItem("neonDodgeBest") || 0);
    bestEl.textContent = best;

    let player, blocks, score, gameOver, keys = {};

    function reset() {
      player = { x: canvas.width / 2 - 20, y: canvas.height - 55, w: 40, h: 20 };
      blocks = [];
      score = 0;
      gameOver = false;
      scoreEl.textContent = 0;
    }

    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    function moveTouch(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * canvas.width;
      player.x = Math.max(0, Math.min(canvas.width - player.w, relX - player.w / 2));
    }
    canvas.addEventListener("touchmove", e => { e.preventDefault(); moveTouch(e.touches[0].clientX); }, { passive: false });
    canvas.addEventListener("mousemove", e => { if (e.buttons === 1) moveTouch(e.clientX); });

    function spawnBlock() {
      const w = 45 + Math.random() * 65;
      blocks.push({
        x: Math.random() * (canvas.width - w),
        y: -25,
        w,
        h: 18,
        speed: 3 + Math.min(6, score * 0.08)
      });
    }

    let frame = 0;
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!gameOver) {
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= 5;
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += 5;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

        frame++;
        if (frame % 36 === 0) spawnBlock();

        ctx.fillStyle = "#FFD500";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        for (let i = blocks.length - 1; i >= 0; i--) {
          const b = blocks[i];
          b.y += b.speed;
          ctx.fillStyle = "#FF477E";
          ctx.fillRect(b.x, b.y, b.w, b.h);

          const hit = player.x < b.x + b.w && player.x + player.w > b.x &&
                      player.y < b.y + b.h && player.y + player.h > b.y;
          if (hit) {
            gameOver = true;
            if (score > best) {
              best = score;
              localStorage.setItem("neonDodgeBest", best);
              bestEl.textContent = best;
            }
          } else if (b.y > canvas.height) {
            blocks.splice(i, 1);
            score++;
            scoreEl.textContent = score;
          }
        }
      } else {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 15);
        ctx.font = "16px system-ui";
        ctx.fillText("Click or Tap to Play Again", canvas.width / 2, canvas.height / 2 + 18);
      }
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("click", () => { if (gameOver) reset(); });
    canvas.addEventListener("touchstart", () => { if (gameOver) reset(); });

    reset();
    loop();
  </script>
</body>
</html>
