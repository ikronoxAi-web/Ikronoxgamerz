<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Neon Dodge</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      background: #0A0A0A; color: #fff; font-family: system-ui, sans-serif;
      overflow: hidden; user-select: none; -webkit-user-select: none;
    }
    .wrap {
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 10px 12px 14px; gap: 8px;
    }
    .hud {
      font-weight: 800; color: #FFD500; font-size: 1rem;
      letter-spacing: 0.4px; flex-shrink: 0;
    }
    .stage {
      flex: 1; width: 100%; max-width: 520px; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      width: 100%; height: 100%;
      background: #111; border: 2px solid #7A00FF; border-radius: 14px;
      touch-action: none; display: block;
    }
    .hint {
      font-size: 0.82rem; color: #bbb; text-align: center; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
    <div class="stage">
      <canvas id="c"></canvas>
    </div>
    <div class="hint">Drag or tap left/right to move (Arrow / A-D on PC)</div>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const stage = document.querySelector(".stage");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    let best = Number(localStorage.getItem("neonDodgeBest") || 0);
    bestEl.textContent = best;

    let W = 380, H = 560;
    let player = { x: 170, y: 490, w: 46, h: 22 };
    let blocks = [], score = 0, gameOver = false, keys = {}, frame = 0;

    function resizeCanvas() {
      const rect = stage.getBoundingClientRect();
      const targetW = Math.max(240, Math.floor(rect.width));
      const targetH = Math.max(300, Math.floor(rect.height));
      if (canvas.width !== targetW || canvas.height !== targetH) {
        const prevW = W || targetW;
        const prevH = H || targetH;
        canvas.width = targetW;
        canvas.height = targetH;
        W = targetW;
        H = targetH;
        player.w = Math.max(38, Math.min(64, Math.round(W * 0.12)));
        player.h = Math.max(18, Math.min(26, Math.round(H * 0.036)));
        player.x = Math.max(0, Math.min(W - player.w, (player.x / prevW) * W));
        player.y = H - player.h - Math.max(24, Math.round(H * 0.06));
      }
    }

    function reset() {
      resizeCanvas();
      player.x = W / 2 - player.w / 2;
      player.y = H - player.h - Math.max(24, Math.round(H * 0.06));
      blocks = [];
      score = 0;
      frame = 0;
      gameOver = false;
      scoreEl.textContent = 0;
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    function moveTouch(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      player.x = Math.max(0, Math.min(W - player.w, relX - player.w / 2));
    }
    canvas.addEventListener("touchstart", e => {
      if (gameOver) { reset(); return; }
      e.preventDefault();
      moveTouch(e.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener("touchmove", e => {
      if (gameOver) return;
      e.preventDefault();
      moveTouch(e.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener("mousemove", e => {
      if (!gameOver && e.buttons === 1) moveTouch(e.clientX);
    });

    function spawnBlock() {
      const w = Math.max(38, Math.min(W * 0.28, 45 + Math.random() * 65));
      const h = Math.max(16, Math.min(26, Math.round(H * 0.03)));
      const speedScale = H / 520;
      blocks.push({
        x: Math.random() * Math.max(10, W - w),
        y: -h - 8,
        w,
        h,
        speed: (3 + Math.min(6, score * 0.08)) * speedScale
      });
    }

    function loop() {
      resizeCanvas();
      ctx.clearRect(0, 0, W, H);
      if (!gameOver) {
        const moveSpeed = Math.max(4.5, W * 0.014);
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= moveSpeed;
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += moveSpeed;
        player.x = Math.max(0, Math.min(W - player.w, player.x));

        frame++;
        if (frame % 36 === 0) spawnBlock();

        ctx.fillStyle = "#FFD500";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        for (let i = blocks.length - 1; i >= 0; i--) {
          const b = blocks[i];
          b.y += b.speed;
          ctx.fillStyle = "#FF477E";
          ctx.fillRect(b.x, b.y, b.w, b.h);

          const hit = player.x < b.x + b.w && player.x + player.w > b.x &&
                      player.y < b.y + b.h && player.y + player.h > b.y;
          if (hit) {
            gameOver = true;
            if (score > best) {
              best = score;
              localStorage.setItem("neonDodgeBest", best);
              bestEl.textContent = best;
            }
          } else if (b.y > H) {
            blocks.splice(i, 1);
            score++;
            scoreEl.textContent = score;
          }
        }
      } else {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", W / 2, H / 2 - 14);
        ctx.font = "16px system-ui";
        ctx.fillText("Tap to Play Again", W / 2, H / 2 + 18);
      }
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("click", () => { if (gameOver) reset(); });

    reset();
    loop();
  </script>
</body>
</html>
