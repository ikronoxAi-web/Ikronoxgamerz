<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikronox Gaming</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #eee;
        }
        header {
            background-color: #222;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 3em;
            color: #f0f;
            text-shadow: 0 0 5px #f0f, 0 0 10px #0ff;
        }
        #game-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 50px;
            gap: 20px;
        }
        .game-card {
            background-color: #333;
            border: 2px solid #444;
            border-radius: 10px;
            width: 200px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .game-card:hover {
            transform: scale(1.05);
            border-color: #0ff;
        }
        .game-title {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #0ff;
        }
        .game-desc {
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>

<header>
    <h1>Ikronox Gaming</h1>
</header>

<main id="game-list">
    <!-- Game cards will be dynamically added here later -->
    <a href="games/neon-dodge/index.html" class="game-card">
        <div class="game-title">Neon Dodge</div>
        <div class="game-desc">Avoid the neon obstacles! Mobile & Desktop.</div>
    </a>
</main>

</body>
</html>
